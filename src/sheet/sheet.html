<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>お気に入り巡回シート</title>
  <link rel="stylesheet" href="sheet.css">
</head>
<body>
  <header class="top">
    <div class="ttl">
      <h1 id="title">巡回シート</h1>
      <p class="sub" id="sub">読み込んでいます…</p>
    </div>

    <div class="seg" id="mode" role="tablist">
      <button data-mode="all" class="on" role="tab">巡回シート</button>
      <button data-mode="errand" role="tab">お使いだけ</button>
    </div>

    <button id="print" class="primary">PDF で保存 / 印刷</button>
  </header>

  <div class="bar">
    <span class="total" id="total"></span>
    <span class="spacer"></span>
    <button id="fillBudget" class="ghost" hidden>頒布物の価格で予算を埋める</button>
    <button id="optToggle" class="ghost" aria-expanded="false">表示を調整</button>
    <button id="reload" class="ghost">取り直す</button>
  </div>

  <section class="opts" id="opts" hidden>
    <label><input type="checkbox" id="optMap" checked> 配置図</label>
    <label><input type="checkbox" id="optBooks" checked> 頒布物</label>
    <label><input type="checkbox" id="optExternals" checked> 書店</label>
    <label>優先度
      <select id="optFilter">
        <option value="0">すべて</option>
        <option value="1">◎ のみ</option>
        <option value="2">◎ ○ まで</option>
        <option value="3">◎ ○ △ まで</option>
      </select>
    </label>
    <label>お使い欄 <input type="number" id="optLines" min="0" max="6" step="1" value="2"> 行</label>
  </section>

  <div class="hint" id="hint">
    <b>◎ ○ △ の優先度・予算・お使いメモは、この画面でそのまま書き込めます。</b>
    書いた内容はこの拡張機能の中だけに残り、サイトのメモは書き換えません。
    スペースとサークル名を押すと、サイトのそのサークルのところが開きます。
    <button class="x" id="hintClose" title="閉じる">×</button>
  </div>

  <div id="progress" class="progress"><span class="spin"></span><span id="progressText">準備中…</span></div>
  <div id="content"></div>

  <script src="../lib/space.js"></script>
  <script src="../lib/csv.js"></script>
  <script src="../lib/store.js"></script>
  <script src="../lib/api.js"></script>
  <script src="../lib/detail.js"></script>
  <script src="../lib/grid.js"></script>
  <script src="../lib/plan.js"></script>
  <script src="../lib/build.js"></script>
  <script src="../lib/render.js"></script>
  <script src="sheet.js"></script>
</body>
</html>
