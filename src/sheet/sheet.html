<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>お気に入り巡回シート</title>
  <link rel="stylesheet" href="sheet.css">
</head>
<body>
  <div class="top">
    <h1>お気に入り巡回シート</h1>
    <div class="sub" id="sub">読み込み中…</div>

    <div class="total" id="total"></div>

    <div class="controls">
      <label><input type="checkbox" id="optMap" checked> 配置図</label>
      <label><input type="checkbox" id="optBooks" checked> 頒布物</label>
      <label><input type="checkbox" id="optExternals" checked> 書店</label>
      <label>お使い欄 <input type="number" id="optLines" min="0" max="6" step="1" value="2"> 行</label>
      <label>絞り込み
        <select id="optFilter">
          <option value="0">全部</option>
          <option value="1">◎ のみ</option>
          <option value="2">◎○ まで</option>
          <option value="3">◎○△ まで</option>
        </select>
      </label>
      <button id="reload">取り直す</button>
      <button id="print" class="primary">PDF で保存 / 印刷</button>
    </div>
  </div>

  <div class="note" id="note">
    優先度（◎ 高 / ○ 中 / △ 低）・予算・お使いメモは、この画面で直接書き換えられます。
    書いた内容はこの拡張機能の中に保存され、サイト側のお気に入りメモには影響しません。
    予算はサークルごとの見込み額で、頒布物の価格はサイトが公開していないため自分で入れる形です。
    お使いメモを空のままにすると、紙に手書きできるよう罫線が入ります。
  </div>

  <div id="progress" class="progress">準備中…</div>
  <div id="content"></div>

  <script src="../lib/space.js"></script>
  <script src="../lib/csv.js"></script>
  <script src="../lib/store.js"></script>
  <script src="../lib/api.js"></script>
  <script src="../lib/detail.js"></script>
  <script src="../lib/grid.js"></script>
  <script src="../lib/plan.js"></script>
  <script src="../lib/build.js"></script>
  <script src="../lib/render.js"></script>
  <script src="sheet.js"></script>
</body>
</html>
