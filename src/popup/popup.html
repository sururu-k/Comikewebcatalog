<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>WebCatalog Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>WebCatalog Helper</strong>
  </header>

  <div id="count" class="count">読み込み中…</div>

  <div id="offsite" class="notice hidden">
    サークル一覧のタブで開いてください。
    <a href="https://webcatalog.circle.ms/circle/list" target="_blank" rel="noopener">一覧を開く</a>
  </div>

  <section>
    <h2>収集</h2>
    <div class="row">
      <button id="panel">パネルを表示 / 隠す</button>
    </div>
    <div class="row">
      <button id="collect">画面分だけ取込</button>
      <button id="auto" class="primary">最後まで収集</button>
    </div>
    <div class="row">
      <button id="stop" class="danger">停止</button>
    </div>
  </section>

  <section>
    <h2>出力</h2>
    <div class="row">
      <button id="csv">CSV</button>
      <button id="json">JSON</button>
    </div>
  </section>

  <section>
    <h2>設定</h2>
    <label class="check">
      <input type="checkbox" id="autoCollect">
      表示されたサークルを自動で取り込む
    </label>
    <label class="field">
      スクロール間隔 (ms)
      <input type="number" id="scrollStepMs" min="200" max="5000" step="50">
    </label>
    <label class="field">
      一括操作の間隔 (ms)
      <input type="number" id="bulkIntervalMs" min="200" max="5000" step="50">
    </label>
    <label class="field">
      一括操作の上限 (件)
      <input type="number" id="bulkMaxItems" min="1" max="5000" step="10">
    </label>
  </section>

  <div id="status" class="status">—</div>

  <script src="../lib/space.js"></script>
  <script src="../lib/csv.js"></script>
  <script src="../lib/store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
